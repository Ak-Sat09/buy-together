server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: buy-together
  data:
    mongodb:
      # TEMPORARY for testing only, remove before going live and use the env variable instead
      uri: ${SPRING_DATA_MONGODB_URI:mongodb+srv://anmol:Mehla%406228@chat-service.3pp23dc.mongodb.net/buy_together?authSource=admin&appName=Chat-Service}
      auto-index-creation: ${MONGODB_AUTO_INDEX_CREATION:true}
  mail:
    # any SMTP server works (Gmail with an app password, Brevo, SES). Port 587, AWS blocks 25.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # don't log in to the SMTP server on every health check
    mail:
      enabled: false

buy-together:
  # URL prefix for every endpoint. Empty when running on its own; "/buy-together" inside Generic-Backend
  api-prefix: ${BT_API_PREFIX:}
  jwt:
    # TEMPORARY for testing only
    secret: ${JWT_SECRET:buy-together-test-secret-key-change-me-before-live}
    ttl: ${JWT_TTL:7d}
    issuer: buy-together

  otp:
    length: 6
    ttl: 5m
    resend-cooldown: 60s
    max-attempts: 5
    # "log" prints the OTP to the server log, "twilio" sends a real SMS
    sender: ${OTP_SENDER:log}
    # "log" prints email OTPs to the server log, "smtp" sends them through spring.mail
    email-sender: ${EMAIL_OTP_SENDER:log}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}

  google:
    # OAuth client id from Google Cloud Console; Google login is off while empty
    client-id: ${GOOGLE_CLIENT_ID:}

  groups:
    min-size: 2
    max-size: 50
    max-open-per-user: 3
    max-deadline-days: 90
    # Completed, closed and expired groups are deleted this many days after they finish
    purge-after-days: 30
    maintenance-cron: "0 5 0 * * *"

  cache:
    group:
      max-size: 5000
      ttl: 10m
    search:
      max-size: 500
      ttl: 30s

  cors:
    # Comma-separated, wildcards allowed. Covers local dev and every Vercel deployment
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://*.vercel.app}

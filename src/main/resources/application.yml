server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: buy-together
  data:
    mongodb:
      # TEMPORARY for testing only, remove before going live and use the env variable instead
      uri: ${SPRING_DATA_MONGODB_URI:mongodb+srv://anmol:Mehla%406228@chat-service.3pp23dc.mongodb.net/buy_together?authSource=admin&appName=Chat-Service}
      auto-index-creation: ${MONGODB_AUTO_INDEX_CREATION:true}
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

buy-together:
  jwt:
    # TEMPORARY for testing only
    secret: ${JWT_SECRET:buy-together-test-secret-key-change-me-before-live}
    ttl: ${JWT_TTL:7d}
    issuer: buy-together

  otp:
    length: 6
    ttl: 5m
    resend-cooldown: 60s
    max-attempts: 5
    # "log" prints the OTP to the server log. Plug in a real SMS sender before going live.
    sender: ${OTP_SENDER:log}

  groups:
    min-size: 2
    max-size: 50
    max-open-per-user: 3
    max-deadline-days: 90
    # Completed, closed and expired groups are deleted this many days after they finish
    purge-after-days: 30
    maintenance-cron: "0 5 0 * * *"

  cache:
    group:
      max-size: 5000
      ttl: 10m
    search:
      max-size: 500
      ttl: 30s

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: buy-together
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/buy_together}
      auto-index-creation: ${MONGODB_AUTO_INDEX_CREATION:true}
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:7d}
    issuer: buy-together

  otp:
    length: 6
    ttl: 5m
    resend-cooldown: 60s
    max-attempts: 5
    # "log" prints the OTP to the server log. Plug in a real SMS sender before going live.
    sender: ${OTP_SENDER:log}

  groups:
    min-size: 2
    max-size: 50
    max-open-per-user: 3
    max-deadline-days: 90
    expiry-cron: "0 5 0 * * *"

  cache:
    group:
      max-size: 5000
      ttl: 10m
    search:
      max-size: 500
      ttl: 30s

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
